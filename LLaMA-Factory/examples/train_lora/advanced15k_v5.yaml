### Model
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: true
### Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
### Dataset
dataset: advanced15k_v5
dataset_dir: data
template: qwen
cutoff_len: 6144
overwrite_cache: true
preprocessing_num_workers: 8
### Output
output_dir: saves/qwen2.5-3b/advanced15k_v5
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
report_to: none
### Training
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0001
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
